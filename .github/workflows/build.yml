name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller pytest
      # -rs lists the reason for every skip. The corpus regressions need
      # AK_CORPUS, which is real save data and is never committed, so they
      # cannot run here — that has to be visible in the log rather than
      # hidden behind a green tick.
      - run: python -m pytest tests -v -rs
      - run: >
          pyinstaller --onedir --noupx --noconsole
          --name "AK-Riddler-Save-Editor"
          --add-data "aksave/data/manifest.json;aksave/data"
          ak_riddler_editor.py
      - run: Compress-Archive dist/AK-Riddler-Save-Editor AK-Riddler-Save-Editor.zip
      # Attest both: the exe is what the README tells people to verify, and the
      # zip is what they actually download. Attesting only the exe meant
      # `gh attestation verify` on the downloaded file reported no attestation
      # found — which reads as confirmation to someone already worried it is
      # malware.
      #
      # Skipped while the repository is private. Artifact attestations are
      # public-repository-only on the Free, Pro and Team plans; private repos
      # need GitHub Enterprise Cloud. Without this guard the step fails and
      # takes the release with it, so a private tag would produce no asset at
      # all. Once the repository is public the condition is true and every
      # release is attested — which is the state the README describes.
      - uses: actions/attest-build-provenance@v1
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            dist/AK-Riddler-Save-Editor/AK-Riddler-Save-Editor.exe
            AK-Riddler-Save-Editor.zip
      - if: ${{ github.event.repository.private }}
        run: |
          echo "::warning::Repository is private, so build provenance attestation was skipped."
          echo "::warning::Re-tag once the repository is public to get an attested release."
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: AK-Riddler-Save-Editor.zip }
