name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller pytest
      # -rs lists the reason for every skip. The corpus regressions need
      # AK_CORPUS, which is real save data and is never committed, so they
      # cannot run here — that has to be visible in the log rather than
      # hidden behind a green tick.
      - run: python -m pytest tests -v -rs
      # This command is quoted verbatim in README.md, under "Option C — build
      # the .exe yourself". Change one without the other and the README is
      # lying about how the release was built, which is the whole point of
      # publishing the command at all.
      - run: >
          pyinstaller --onedir --noupx --noconsole
          --name "AK-Riddler-Save-Editor"
          --add-data "aksave/data/manifest.json;aksave/data"
          ak_riddler_editor.py
      # GPL-3.0 s4 and s6: conveying object code means conveying the licence
      # with it. The zip is the only thing most people ever receive, so the
      # licence has to be inside it, not only in the repository.
      - run: Copy-Item LICENSE dist/AK-Riddler-Save-Editor/LICENSE
      - run: Compress-Archive dist/AK-Riddler-Save-Editor AK-Riddler-Save-Editor.zip
      # body_path, not a hand-written release: v1.0.0 shipped with an empty
      # description because the release step passed only `files:`, and the
      # release page is where every download link lands.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: AK-Riddler-Save-Editor.zip
          body_path: .github/RELEASE_NOTES.md

# ---------------------------------------------------------------------------
# There is no build provenance attestation here. It was removed deliberately,
# not forgotten, so the reasoning and the recipe live with the file.
#
# Why it went:
#   * Artifact attestations are public-repository-only on the Free, Pro and
#     Team plans; private repositories need GitHub Enterprise Cloud. On this
#     account the step was permanently skipped and never produced a single
#     attestation.
#   * Making the repository public does not attest a release that already
#     exists. A NEW tag is required, so the guarantee was gated behind two
#     separate future events.
#   * The user-facing half was worse than nothing. `gh attestation verify`
#     needs the GitHub CLI *and* a GitHub account, and when there is nothing
#     to find it prints a bare `Error: HTTP 404: Not Found` with a raw
#     api.github.com URL — identical whether the repository is private, has no
#     attestations, or does not concern you at all. Handing that to someone
#     whose antivirus has just gone off reads as confirmation.
#   * README.md now answers "why should I trust this binary" with things the
#     audience can actually do: run from source, or build the .exe with the
#     exact pyinstaller command above.
#
# To put it back — public repository only:
#   1. Add to `permissions:` above:  id-token: write  and  attestations: write
#      (actions/attest also documents artifact-metadata: write, but that is for
#      storage records on organisation-owned repositories and does not apply
#      to a personal account.)
#   2. Add a step AFTER the release step above, so a failure there can never
#      cost the release asset. Use actions/attest — as of v4,
#      actions/attest-build-provenance is only a wrapper around it:
#
#        - uses: actions/attest@v4
#          with:
#            subject-path: |
#              dist/AK-Riddler-Save-Editor/AK-Riddler-Save-Editor.exe
#              AK-Riddler-Save-Editor.zip
#
#      Attest both. The zip is what people download; the .exe is what they run.
#      Attesting only one means verification of the other reports nothing found.
#   3. Push a NEW tag. Existing releases stay unattested for good.
#   4. If you then document verification, put it in SECURITY.md, not in the
#      README FAQ. The FAQ is read by someone who is already frightened.
# ---------------------------------------------------------------------------
